[package]
name = "RustQtCalculator"
version = "0.1.0"
edition = "2024"


[dependencies]
qtbridge = "0.2.0"


[build-dependencies]
vcpkg = "0.2"
toml = "0.8"


[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "master"


[package.metadata.vcpkg.target]
x86_64-apple-darwin = { dependencies = ["qtbase", "qtdeclarative", "qttools", "qtsvg"]}
x86_64-unknown-linux-gnu = { dependencies = ["qtbase[gtk3]", "qtdeclarative", "qttools", "qtsvg", "qtwayland"]}
x86_64-pc-windows-msvc = { dependencies = ["qtbase", "qtdeclarative", "qttools", "qtsvg"], triplet="x64-windows"}

